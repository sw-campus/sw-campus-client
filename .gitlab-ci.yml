stages:
  - lint
  - build
  - update-manifest

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE


# Lint Check (MR 시)
lint:
  stage: lint
  image: node:20-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
      - .pnpm-store/


# Build Dev (develop 브랜치 전용)
build-dev:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    TAG: "RHSA-$CI_COMMIT_SHA"
    DOCKER_HOST: tcp://docker:2375
  script:
    - |
      echo "Building DEV image with tag $TAG"

      docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY

      docker build \
        --build-arg NEXT_PUBLIC_API_URL="${DEV_NEXT_PUBLIC_API_URL}" \
        --build-arg NEXT_PUBLIC_BASE_URL="${DEV_NEXT_PUBLIC_BASE_URL}" \
        --build-arg NEXT_PUBLIC_GA_ID="${NEXT_PUBLIC_GA_ID}" \
        --build-arg NEXT_PUBLIC_S3_HOSTNAME="${NEXT_PUBLIC_S3_HOSTNAME}" \
        --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${DEV_NEXT_PUBLIC_GOOGLE_CLIENT_ID}" \
        --build-arg NEXT_PUBLIC_GITHUB_CLIENT_ID="${DEV_NEXT_PUBLIC_GITHUB_CLIENT_ID}" \
        --build-arg NEXT_PUBLIC_KAKAO_CLIENT_ID="${DEV_NEXT_PUBLIC_KAKAO_CLIENT_ID}" \
        --build-arg NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION="${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION}" \
        --build-arg NEXT_PUBLIC_NAVER_SITE_VERIFICATION="${NEXT_PUBLIC_NAVER_SITE_VERIFICATION}" \
        -t $IMAGE_NAME:$TAG .

      docker push $IMAGE_NAME:$TAG
      echo "IMAGE_TAG=$TAG" >> build.env
  artifacts:
    reports:
      dotenv: build.env

update-manifest-dev:
  stage: update-manifest
  image: alpine:latest
  needs:
    - job: build-dev
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - apk add --no-cache git curl bash
  script:
    - |
      TAG="RHSA-$CI_COMMIT_SHA"

      git clone https://oauth2:${MANIFEST_TOKEN}@${CI_SERVER_HOST}/${MANIFEST_PROJECT_PATH}.git manifest
      cd manifest

      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@${CI_SERVER_HOST}"
      git checkout develop

      # 수정된 sed 패턴: frontend/client
      sed -i "/repository:.*frontend\/client/,/pullPolicy:/ s|tag: \".*\"|tag: \"$TAG\"|" k8s/environments/develop/values.yaml

      git add .
      if git diff --staged --quiet; then
        echo "No changes to commit"
      else
        git commit -m "chore(client): update dev image to $TAG"
        git push origin develop
      fi


# Build Release (main 브랜치 전용)
build-release:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
      when: manual
  before_script:
    - apk add --no-cache nodejs npm jq
  script:
    - |
      CURRENT_VERSION=$(node -p "require('./package.json').version")
      echo "Current version: $CURRENT_VERSION"

      MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
      MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
      PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
      NEW_PATCH=$((PATCH + 1))
      NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
      VERSION_TAG="v${NEW_VERSION}"

      echo "New version: $NEW_VERSION (tag: $VERSION_TAG)"
      echo "VERSION_TAG=$VERSION_TAG" >> build.env
      echo "NEW_VERSION=$NEW_VERSION" >> build.env

      jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp
      mv package.json.tmp package.json

      docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY

      docker build \
        --build-arg NEXT_PUBLIC_BASE_URL=$NEXT_PUBLIC_BASE_URL \
        --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
        --build-arg NEXT_PUBLIC_GA_ID=$NEXT_PUBLIC_GA_ID \
        --build-arg NEXT_PUBLIC_S3_HOSTNAME=$NEXT_PUBLIC_S3_HOSTNAME \
        --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=$NEXT_PUBLIC_GOOGLE_CLIENT_ID \
        --build-arg NEXT_PUBLIC_GITHUB_CLIENT_ID=$NEXT_PUBLIC_GITHUB_CLIENT_ID \
        --build-arg NEXT_PUBLIC_KAKAO_CLIENT_ID=$NEXT_PUBLIC_KAKAO_CLIENT_ID \
        --build-arg NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=$NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION \
        --build-arg NEXT_PUBLIC_NAVER_SITE_VERIFICATION=$NEXT_PUBLIC_NAVER_SITE_VERIFICATION \
        -t $IMAGE_NAME:$VERSION_TAG .

      docker push $IMAGE_NAME:$VERSION_TAG
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - package.json

commit-version-bump:
  stage: build
  image: alpine:latest
  needs:
    - job: build-release
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  before_script:
    - apk add --no-cache git
  script:
    - |
      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@${CI_SERVER_HOST}"

      git remote set-url origin https://oauth2:${PROJECT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git

      git add package.json
      git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
      git push origin HEAD:main

      git tag -f "$VERSION_TAG"
      git push origin "$VERSION_TAG" -f

update-manifest-release:
  stage: update-manifest
  image: alpine:latest
  needs:
    - job: build-release
      artifacts: true
    - job: commit-version-bump
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
      when: manual
  before_script:
    - apk add --no-cache git curl bash
  script:
    - |
      git clone https://oauth2:${MANIFEST_TOKEN}@${CI_SERVER_HOST}/${MANIFEST_PROJECT_PATH}.git manifest
      cd manifest

      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@${CI_SERVER_HOST}"
      git checkout release

      sed -i "/repository:.*frontend\/client/,/pullPolicy:/ s|tag: \".*\"|tag: \"$VERSION_TAG\"|" k8s/environments/release/values.yaml

      git add .
      if git diff --staged --quiet; then
        echo "No changes to commit"
      else
        git commit -m "chore(client): update prod image to $VERSION_TAG"
        git push origin release
      fi